name: SpeechBench
options:
  bundleIdPrefix: com.matthewthomas
  deploymentTarget:
    iOS: "17.0"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    # main as of 2026-09-29: adds long-text chunking for Kokoro that v0.17.4 lacks.
    revision: 8145085136df11758cc1303ab54d8e032c12bd41
targets:
  SpeechBench:
    type: application
    platform: iOS
    sources: [SpeechBench]
    dependencies:
      - package: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewthomas.SpeechBench
        DEVELOPMENT_TEAM: QK9K4AQRNH
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SpeechBench
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record speech to benchmark Parakeet transcription on-device.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
